<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mastuung Courier</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 450px;
      padding: 30px;
      border-radius: 25px;
      background: #1e293b;
      text-align: center;
      border: 1px solid #334155;
    }

    .logo {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      color: #38bdf8;
    }

    p {
      color: #cbd5e1;
      line-height: 1.6;
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 12px;
      background: #064e3b;
      color: #a7f3d0;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="logo">🏍️</div>

    <h1>MASTUUNG COURIER</h1>

    <p>
      Sistem pencatatan order, tarif,
      dan aktivitas kurir lokal.
    </p>

    <div class="status">
      Website berhasil dibuat!
    </div>
  </div>

</body>
</html>
